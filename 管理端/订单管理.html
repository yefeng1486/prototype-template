<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单管理</title>
  <link rel="stylesheet" href="../公共/design-system/design-system.css">
  <link rel="stylesheet" href="../公共/styles/main.css">
  <link rel="stylesheet" href="../公共/lib/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="管理端.css">
  <script src="../公共/scripts/common.js"></script>
  <script src="../公共/scripts/mock-api.js"></script>

  <style>
    .page { padding: var(--space-lg); }
    .stat-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-sm); margin-bottom: var(--space-md); }
    .mini-stat { padding: var(--space-md); background: #fff; border-radius: var(--radius-md); border: 1px solid var(--color-border); text-align: center; }
    .mini-stat .num { font-size: 22px; font-weight: 700; }
    .mini-stat .label { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
    .tabs { display: flex; gap: 4px; margin-bottom: var(--space-md); }
    .tab { padding: 8px 16px; border-radius: var(--radius-md); font-size: 14px; cursor: pointer; transition: all var(--transition-fast); }
    .tab:hover { background: var(--color-bg-hover); }
    .tab.active { background: var(--color-primary); color: #fff; }
    .order-status { padding: 2px 8px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; }
    .order-status.pending { background: var(--color-warning-bg); color: var(--color-warning); }
    .order-status.paid { background: var(--color-info-bg); color: var(--color-info); }
    .order-status.shipped { background: var(--color-primary-bg); color: var(--color-primary); }
    .order-status.completed { background: var(--color-success-bg); color: var(--color-success); }
    .order-status.cancelled { background: var(--color-danger-bg); color: var(--color-danger); }
  </style>
</head>
<body>
  <div class="page">
    <!-- 订单统计 -->
    <div class="stat-row" id="statRow">
      <div class="mini-stat"><div class="num" id="sAll">-</div><div class="label">全部订单</div></div>
      <div class="mini-stat"><div class="num" id="sPending" style="color:var(--color-warning);">-</div><div class="label">待付款</div></div>
      <div class="mini-stat"><div class="num" id="sPaid" style="color:var(--color-info);">-</div><div class="label">已付款</div></div>
      <div class="mini-stat"><div class="num" id="sShipped" style="color:var(--color-primary);">-</div><div class="label">已发货</div></div>
      <div class="mini-stat"><div class="num" id="sCompleted" style="color:var(--color-success);">-</div><div class="label">已完成</div></div>
    </div>

    <!-- 状态筛选 -->
    <div class="tabs">
      <div class="tab active" data-status="">全部</div>
      <div class="tab" data-status="pending">待付款</div>
      <div class="tab" data-status="paid">已付款</div>
      <div class="tab" data-status="shipped">已发货</div>
      <div class="tab" data-status="completed">已完成</div>
      <div class="tab" data-status="cancelled">已取消</div>
    </div>

    <!-- 订单表格 -->
    <div class="card">
      <div class="card-body" style="padding:0;">
        <table class="data-table">
          <thead><tr><th>订单号</th><th>用户</th><th>商品</th><th>数量</th><th>金额</th><th>状态</th><th>下单时间</th><th>操作</th></tr></thead>
          <tbody id="tableBody"><tr><td colspan="8" style="text-align:center;padding:40px;color:var(--color-text-placeholder);">加载中...</td></tr></tbody>
        </table>
      </div>
      <div class="card-footer"><div class="pagination" id="pagination"></div></div>
    </div>
  </div>

  <script>
    (function () {
      var currentPage = 1, pageSize = 10, currentStatus = '';
      var statusMap = { pending: '待付款', paid: '已付款', shipped: '已发货', completed: '已完成', cancelled: '已取消' };

      // 统计
      var allOrders = MockAPI.raw.orders;
      document.getElementById('sAll').textContent = allOrders.length;
      document.getElementById('sPending').textContent = allOrders.filter(function (o) { return o.status === 'pending'; }).length;
      document.getElementById('sPaid').textContent = allOrders.filter(function (o) { return o.status === 'paid'; }).length;
      document.getElementById('sShipped').textContent = allOrders.filter(function (o) { return o.status === 'shipped'; }).length;
      document.getElementById('sCompleted').textContent = allOrders.filter(function (o) { return o.status === 'completed'; }).length;

      function loadData() {
        Common.renderSkeleton(document.getElementById('tableBody'), pageSize);
        MockAPI.getOrders({ page: currentPage, pageSize: pageSize, status: currentStatus }).then(function (res) {
          var tbody = document.getElementById('tableBody');
          if (res.list.length === 0) { Common.renderEmpty(tbody, '暂无订单'); return; }
          tbody.innerHTML = res.list.map(function (o) {
            return '<tr>' +
              '<td style="font-size:13px;">' + o.id + '</td>' +
              '<td>' + o.userName + '</td>' +
              '<td>' + o.productName + '</td>' +
              '<td>' + o.quantity + '</td>' +
              '<td style="font-weight:500;">' + Common.formatMoney(o.amount) + '</td>' +
              '<td><span class="order-status ' + o.status + '">' + (statusMap[o.status] || o.status) + '</span></td>' +
              '<td style="color:var(--color-text-secondary);font-size:13px;">' + o.date + '</td>' +
              '<td><button class="btn btn-ghost btn-sm" onclick="Common.toast(\'查看订单 ' + o.id + '\', \'info\')">查看</button></td>' +
              '</tr>';
          }).join('');
          renderPagination(res);
        });
      }

      function renderPagination(res) {
        Common.renderPagination('pagination', currentPage, res.totalPages, res.total, function (p) { currentPage = p; loadData(); }, {
          pageSize: pageSize,
          onPageSizeChange: function (size) { pageSize = size; currentPage = 1; loadData(); }
        });
      }

      document.querySelectorAll('.tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
          document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
          tab.classList.add('active');
          currentStatus = tab.dataset.status;
          currentPage = 1;
          loadData();
        });
      });

      loadData();
    })();
  </script>
</body>
</html>
