<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理</title>
  <link rel="stylesheet" href="管理端.css">
  <script src="../公共/scripts/common.js"></script>
  <script src="../公共/scripts/mock-api.js"></script>

  <style>
    .page { padding: var(--space-lg); }
    .toolbar { display: flex; gap: var(--space-sm); margin-bottom: var(--space-md); align-items: center; flex-wrap: wrap; }
    .toolbar .toolbar-input { width: 240px; }
    .role-badge { padding: 2px 10px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; }
    .role-badge.管理员 { background: var(--color-primary-bg); color: var(--color-primary); }
    .role-badge.VIP { background: var(--color-warning-bg); color: #92400E; }
    .role-badge.普通用户 { background: var(--color-bg-hover); color: var(--color-text-secondary); }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .status-dot.active { background: var(--color-success); }
    .status-dot.disabled { background: var(--color-text-disabled); }

    /* 用户详情弹窗 */
    .detail-head { display: flex; align-items: center; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--color-border-light); margin-bottom: 16px; }
    .detail-avatar { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600; color: #fff; flex-shrink: 0; }
    .detail-name { font-size: 18px; font-weight: 600; color: var(--color-text-primary); }
    .detail-sub { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
    .detail-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
    .detail-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: var(--color-bg-hover); border-radius: var(--radius-sm); }
    .detail-label { font-size: 13px; color: var(--color-text-secondary); flex-shrink: 0; white-space: nowrap; }
    .detail-value { font-weight: 500; color: var(--color-text-primary); word-break: break-all; flex: 1; text-align: right; margin-left: 12px; min-width: 0; }
  </style>
</head>
<body>
  <div class="page">
    <!-- 搜索筛选 -->
    <div class="toolbar">
      <input type="text" class="toolbar-input" id="keyword" placeholder="搜索用户名/手机号/邮箱...">
      <select class="toolbar-select" id="roleFilter">
        <option value="">全部角色</option>
        <option value="管理员">管理员</option>
        <option value="VIP">VIP</option>
        <option value="普通用户">普通用户</option>
      </select>
      <select class="toolbar-select" id="statusFilter">
        <option value="">全部状态</option>
        <option value="active">正常</option>
        <option value="disabled">已禁用</option>
      </select>
      <button class="btn btn-primary btn-sm" id="searchBtn"><i class="fa fa-search"></i> 搜索</button>
      <button class="btn btn-secondary btn-sm" id="resetBtn">重置</button>
      <div style="flex:1;"></div>
      <button class="btn btn-primary btn-sm" onclick="openAddModal()"><i class="fa fa-plus"></i> 新增用户</button>
    </div>

    <!-- 表格 -->
    <div class="card">
      <div class="card-body" style="padding:0;">
        <table class="data-table">
          <thead>
            <tr><th>ID</th><th>用户名</th><th>手机号</th><th>邮箱</th><th>角色</th><th>状态</th><th>订单数</th><th>消费金额</th><th>注册时间</th><th>操作</th></tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="10" style="text-align:center;padding:40px;color:var(--color-text-placeholder);">加载中...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="card-footer">
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>

  <!-- 新增用户弹窗 -->
  <div class="modal-overlay" id="addModal" style="display:none;">
    <div class="modal-panel" style="width:520px;min-width:0;">
      <div class="modal-header">
        <div class="modal-title">新增用户</div>
        <button class="modal-close" onclick="closeAddModal()"><i class="fa fa-times"></i></button>
      </div>
      <div class="modal-body">
        <form id="addUserForm" onsubmit="return false;">
          <div class="form-group">
            <label class="form-label">用户名 <span class="required">*</span></label>
            <input type="text" class="form-input" id="f_name" placeholder="请输入用户名" maxlength="20" data-char-counter>
          </div>
          <div class="form-group">
            <label class="form-label">手机号 <span class="required">*</span></label>
            <input type="text" class="form-input" id="f_phone" placeholder="请输入 11 位手机号" maxlength="11" data-char-counter>
          </div>
          <div class="form-group">
            <label class="form-label">邮箱 <span class="required">*</span></label>
            <input type="text" class="form-input" id="f_email" placeholder="请输入邮箱地址" maxlength="50" data-char-counter>
          </div>
          <div style="display:flex;gap:16px;">
            <div class="form-group" style="flex:1;">
              <label class="form-label">角色</label>
              <select class="form-select" id="f_role" style="width:100%;">
                <option value="普通用户">普通用户</option>
                <option value="VIP">VIP</option>
                <option value="管理员">管理员</option>
              </select>
            </div>
            <div class="form-group" style="flex:1;">
              <label class="form-label">状态</label>
              <select class="form-select" id="f_status" style="width:100%;">
                <option value="active">正常</option>
                <option value="disabled">已禁用</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeAddModal()">取消</button>
        <button class="btn btn-primary" id="submitAddBtn" onclick="submitAddUser()">确认新增</button>
      </div>
    </div>
  </div>

  <!-- 用户详情弹窗 -->
  <div class="modal-overlay" id="detailModal" style="display:none;">
    <div class="modal-panel" style="width:480px;min-width:0;">
      <div class="modal-header">
        <div class="modal-title">用户详情</div>
        <button class="modal-close" onclick="closeDetailModal()"><i class="fa fa-times"></i></button>
      </div>
      <div class="modal-body" id="detailBody" style="padding-top:20px;">
        <div style="text-align:center;padding:24px;color:var(--color-text-placeholder);">加载中...</div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeDetailModal()">关闭</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var currentPage = 1;
      var pageSize = 10;
      var params = { keyword: '', role: '', status: '' };

      function loadData() {
        Common.renderSkeleton(document.getElementById('tableBody'), pageSize);
        MockAPI.getUsers(Object.assign({ page: currentPage, pageSize: pageSize }, params)).then(function (res) {
          renderTable(res);
          Common.renderPagination('pagination', currentPage, res.totalPages, res.total, function (p) {
            currentPage = p;
            loadData();
          }, {
            pageSize: pageSize,
            onPageSizeChange: function (size) { pageSize = size; currentPage = 1; loadData(); }
          });
        });
      }

      function renderTable(res) {
        var tbody = document.getElementById('tableBody');
        if (res.list.length === 0) { Common.renderEmpty(tbody, '没有找到匹配的用户'); return; }
        tbody.innerHTML = res.list.map(function (u) {
          return '<tr>' +
            '<td>' + u.id + '</td>' +
            '<td style="font-weight:500;">' + u.name + '</td>' +
            '<td>' + u.phone + '</td>' +
            '<td style="color:var(--color-text-secondary);">' + u.email + '</td>' +
            '<td><span class="role-badge ' + u.role + '">' + u.role + '</span></td>' +
            '<td><span class="status-dot ' + u.status + '"></span>' + (u.status === 'active' ? '正常' : '禁用') + '</td>' +
            '<td>' + u.orders + '</td>' +
            '<td style="font-weight:500;">' + Common.formatMoney(u.amount) + '</td>' +
            '<td style="color:var(--color-text-secondary);font-size:13px;">' + u.registerDate + '</td>' +
            '<td><a href="javascript:void(0)" class="btn btn-ghost btn-sm" onclick="viewUser(' + u.id + ')">查看</a> <a href="javascript:void(0)" class="btn btn-ghost btn-sm" onclick="toggleStatus(' + u.id + ',\'' + u.status + '\')">' + (u.status === 'active' ? '禁用' : '启用') + '</a></td>' +
            '</tr>';
        }).join('');
      }

      /* ===== 查看用户 ===== */
      var detailModal = document.getElementById('detailModal');

      // 头像配色：按角色区分
      var AVATAR_COLORS = {
        '管理员': 'linear-gradient(135deg,#3B82F6,#2563EB)',
        'VIP': 'linear-gradient(135deg,#F59E0B,#D97706)',
        '普通用户': 'linear-gradient(135deg,#9CA3AF,#6B7280)'
      };

      window.closeDetailModal = function () { detailModal.style.display = 'none'; };

      window.viewUser = function (id) {
        detailModal.style.display = 'flex';
        var body = document.getElementById('detailBody');
        body.innerHTML = '<div style="text-align:center;padding:24px;color:var(--color-text-placeholder);">加载中...</div>';
        MockAPI.getUserById(id).then(function (u) {
          var avatarBg = AVATAR_COLORS[u.role] || AVATAR_COLORS['普通用户'];
          var statusText = u.status === 'active' ? '正常' : '已禁用';
          var statusClass = u.status === 'active' ? 'active' : 'disabled';
          body.innerHTML =
            '<div class="detail-head">' +
              '<div class="detail-avatar" style="background:' + avatarBg + ';">' + u.name.charAt(0) + '</div>' +
              '<div>' +
                '<div class="detail-name">' + u.name + '</div>' +
                '<div class="detail-sub">' +
                  '<span class="role-badge ' + u.role + '">' + u.role + '</span>' +
                  '<span style="font-size:13px;color:var(--color-text-secondary);"><span class="status-dot ' + statusClass + '"></span>' + statusText + '</span>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="detail-info">' +
              '<div class="detail-item"><span class="detail-label">用户 ID</span><span class="detail-value">#' + u.id + '</span></div>' +
              '<div class="detail-item"><span class="detail-label">手机号</span><span class="detail-value">' + u.phone + '</span></div>' +
              '<div class="detail-item"><span class="detail-label">邮箱</span><span class="detail-value">' + u.email + '</span></div>' +
              '<div class="detail-item"><span class="detail-label">注册时间</span><span class="detail-value">' + u.registerDate + '</span></div>' +
              '<div class="detail-item"><span class="detail-label">订单数</span><span class="detail-value">' + u.orders + ' 单</span></div>' +
              '<div class="detail-item"><span class="detail-label">累计消费</span><span class="detail-value" style="color:var(--color-primary);">' + Common.formatMoney(u.amount) + '</span></div>' +
            '</div>';
        }).catch(function (err) {
          body.innerHTML = '<div style="text-align:center;padding:24px;color:var(--color-text-placeholder);">' + (err && err.message || '用户不存在') + '</div>';
        });
      };
      // 点击遮罩关闭
      detailModal.addEventListener('click', function (e) {
        if (e.target === detailModal) closeDetailModal();
      });

      window.toggleStatus = function (id, status) {
        Common.confirm('确定要' + (status === 'active' ? '禁用' : '启用') + '该用户吗？', function () {
          Common.toast((status === 'active' ? '已禁用' : '已启用') + '用户 #' + id, 'success');
        });
      };

      /* ===== 新增用户 ===== */
      var addModal = document.getElementById('addModal');

      window.openAddModal = function () {
        document.getElementById('addUserForm').reset();
        addModal.style.display = 'flex';
      };
      window.closeAddModal = function () {
        addModal.style.display = 'none';
      };
      // 表单类弹窗：点击遮罩不关闭（防止误触丢失已填写内容）
      // Esc 只关闭查看类弹窗（详情）；表单弹窗不响应 Esc，防止误触丢失内容
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && detailModal.style.display !== 'none') closeDetailModal();
      });

      window.submitAddUser = function () {
        var name = document.getElementById('f_name').value.trim();
        var phone = document.getElementById('f_phone').value.trim();
        var email = document.getElementById('f_email').value.trim();
        var role = document.getElementById('f_role').value;
        var status = document.getElementById('f_status').value;

        // 校验
        if (!name) { Common.toast('请输入用户名', 'warning'); return; }
        if (!/^1\d{10}$/.test(phone)) { Common.toast('请输入正确的 11 位手机号', 'warning'); return; }
        if (!/^[\w.+-]+@[\w-]+(\.[\w-]+)+$/.test(email)) { Common.toast('请输入正确的邮箱地址', 'warning'); return; }

        var btn = document.getElementById('submitAddBtn');
        btn.disabled = true;
        MockAPI.addUser({ name: name, phone: phone, email: email, role: role, status: status }).then(function (u) {
          btn.disabled = false;
          closeAddModal();
          Common.toast('用户「' + u.name + '」新增成功', 'success');
          // 回到第一页并刷新，确保新用户可见
          currentPage = 1;
          params = { keyword: '', role: '', status: '' };
          document.getElementById('keyword').value = '';
          document.getElementById('roleFilter').value = '';
          document.getElementById('statusFilter').value = '';
          loadData();
        }).catch(function (err) {
          btn.disabled = false;
          Common.toast(err && err.message || '新增失败', 'danger');
        });
      };

      document.getElementById('searchBtn').addEventListener('click', function () {
        params.keyword = document.getElementById('keyword').value.trim();
        params.role = document.getElementById('roleFilter').value;
        params.status = document.getElementById('statusFilter').value;
        currentPage = 1; loadData();
      });

      document.getElementById('resetBtn').addEventListener('click', function () {
        document.getElementById('keyword').value = '';
        document.getElementById('roleFilter').value = '';
        document.getElementById('statusFilter').value = '';
        params = { keyword: '', role: '', status: '' };
        currentPage = 1; loadData();
      });

      document.getElementById('keyword').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('searchBtn').click();
      });

      // 弹窗输入框绑定字符计数器
      Common.bindCharCounters();

      loadData();
    })();
  </script>
</body>
</html>
