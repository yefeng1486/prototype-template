<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仪表盘</title>
  <link rel="stylesheet" href="管理端.css">
  <script src="../公共/scripts/common.js"></script>
  <script src="../公共/scripts/mock-api.js"></script>
  <script src="../公共/lib/echarts/echarts.min.js"></script>

  <style>
    .dashboard { padding: var(--space-lg); }

    /* ---- 统计卡片 ---- */
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: var(--space-lg); }
    .dashboard .stat-card { display: flex; flex-direction: row; align-items: center; gap: 12px; padding: 12px 16px; }
    .dashboard .stat-card .stat-icon {
      width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; line-height: 1;
    }
    .stat-icon.blue   { background: #EFF6FF; color: #2563EB; }
    .stat-icon.green  { background: #ECFDF5; color: #10B981; }
    .stat-icon.orange { background: #FFFBEB; color: #F59E0B; }
    .stat-icon.purple { background: #F5F3FF; color: #8B5CF6; }
    .dashboard .stat-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .dashboard .stat-info .stat-label { font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: 1.3; }
    .dashboard .stat-info .stat-value { font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); color: var(--color-text-primary); line-height: 1.3; }
    .dashboard .stat-info .stat-trend { font-size: var(--font-size-xs); line-height: 1.3; display: block; }
    .stat-card:hover { box-shadow: var(--shadow-md); transition: box-shadow var(--transition-fast); }

    /* ---- 图表卡片 ---- */
    .chart-section { margin-bottom: var(--space-lg); }
    .chart-card { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
    .chart-card-header { padding: var(--space-md) var(--space-lg); border-bottom: 1px solid var(--color-border-light); display: flex; align-items: center; justify-content: space-between; }
    .chart-card-title { font-size: 15px; font-weight: 600; }
    .chart-card-body { padding: var(--space-lg); }
    .chart-wrap { width: 100%; height: 280px; }

    .dashboard-row { display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-md); margin-bottom: var(--space-lg); }
    .dashboard-row-3 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md); margin-bottom: var(--space-lg); }

    /* ---- 订单表格 ---- */
    .recent-orders th, .recent-orders td { white-space: nowrap; }
    .order-status { padding: 2px 8px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; }
    .order-status.pending { background: var(--color-warning-bg); color: var(--color-warning); }
    .order-status.paid { background: var(--color-info-bg); color: var(--color-info); }
    .order-status.shipped { background: var(--color-primary-bg); color: var(--color-primary); }
    .order-status.completed { background: var(--color-success-bg); color: var(--color-success); }
    .order-status.cancelled { background: var(--color-danger-bg); color: var(--color-danger); }

    /* ---- 快捷操作 ---- */
    .quick-actions { display: flex; flex-direction: column; gap: var(--space-sm); }
    .quick-action {
      display: flex; align-items: center; gap: var(--space-sm);
      padding: var(--space-md); background: var(--color-bg-card);
      border-radius: var(--radius-md); border: 1px solid var(--color-border-light);
      cursor: pointer; transition: all var(--transition-fast);
    }
    .quick-action:hover { border-color: var(--color-primary); background: var(--color-primary-bg); }
    .quick-action-icon {
      width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; line-height: 1;
    }
    .quick-action-icon.blue   { background: #EFF6FF; color: #2563EB; }
    .quick-action-icon.green  { background: #ECFDF5; color: #10B981; }
    .quick-action-icon.orange { background: #FFFBEB; color: #F59E0B; }
    .quick-action-text { flex: 1; }
    .quick-action-title { font-size: 14px; font-weight: 500; }
    .quick-action-desc { font-size: 12px; color: var(--color-text-secondary); }
  </style>
</head>
<body>
  <div class="dashboard">
    <!-- 统计卡片 -->
    <div class="stat-grid" id="statGrid">
      <div class="stat-card"><div class="stat-icon blue"><i class="fa fa-user-circle-o" aria-hidden="true"></i></div><div class="stat-info"><div class="stat-label">总用户数</div><div class="stat-value" id="statUsers">-</div><div class="stat-trend up">↑ 12.5% 较上月</div></div></div>
      <div class="stat-card"><div class="stat-icon green"><i class="fa fa-cubes" aria-hidden="true"></i></div><div class="stat-info"><div class="stat-label">在售商品</div><div class="stat-value" id="statProducts">-</div><div class="stat-trend up">↑ 3 新增</div></div></div>
      <div class="stat-card"><div class="stat-icon orange"><i class="fa fa-file-text-o" aria-hidden="true"></i></div><div class="stat-info"><div class="stat-label">总订单数</div><div class="stat-value" id="statOrders">-</div><div class="stat-trend up">↑ 8.2%</div></div></div>
      <div class="stat-card"><div class="stat-icon purple"><i class="fa fa-money" aria-hidden="true"></i></div><div class="stat-info"><div class="stat-label">总营收</div><div class="stat-value" id="statRevenue">-</div><div class="stat-trend up">↑ 15.3%</div></div></div>
    </div>

    <!-- 营收趋势 + 订单状态分布 -->
    <div class="dashboard-row">
      <div class="chart-card">
        <div class="chart-card-header">
          <span class="chart-card-title"><i class="fa fa-line-chart" aria-hidden="true"></i> 近7日营收趋势</span>
          <span style="font-size:12px;color:var(--color-text-secondary);">单位：元</span>
        </div>
        <div class="chart-card-body">
          <div class="chart-wrap" id="trendChart"></div>
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-card-header">
          <span class="chart-card-title"><i class="fa fa-pie-chart" aria-hidden="true"></i> 订单状态分布</span>
        </div>
        <div class="chart-card-body">
          <div class="chart-wrap" id="orderStatusChart"></div>
        </div>
      </div>
    </div>

    <!-- 分类销量 + 流量来源 -->
    <div class="dashboard-row-3">
      <div class="chart-card">
        <div class="chart-card-header">
          <span class="chart-card-title"><i class="fa fa-bar-chart" aria-hidden="true"></i> 商品分类销量</span>
          <span style="font-size:12px;color:var(--color-text-secondary);">本月</span>
        </div>
        <div class="chart-card-body">
          <div class="chart-wrap" id="categoryChart"></div>
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-card-header">
          <span class="chart-card-title"><i class="fa fa-globe" aria-hidden="true"></i> 流量来源分析</span>
        </div>
        <div class="chart-card-body">
          <div class="chart-wrap" id="trafficChart"></div>
        </div>
      </div>
    </div>

    <!-- 最近订单 + 快捷操作 -->
    <div class="dashboard-row" style="margin-bottom:0;">
      <div class="card">
        <div class="card-header">
          <span class="card-title">最近订单</span>
          <a href="#" id="viewAllOrders" style="font-size:13px;">查看全部 →</a>
        </div>
        <div class="card-body" style="padding:0;">
          <table class="data-table recent-orders">
            <thead>
              <tr><th>订单号</th><th>用户</th><th>商品</th><th>金额</th><th>状态</th><th>时间</th></tr>
            </thead>
            <tbody id="recentOrdersBody">
              <tr><td colspan="6" style="text-align:center;padding:40px;color:var(--color-text-placeholder);">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">快捷操作</span></div>
        <div class="card-body">
          <div class="quick-actions">
            <div class="quick-action" onclick="Common.navigateInParent('用户管理.html', '用户管理')">
              <span class="quick-action-icon blue"><i class="fa fa-user-plus" aria-hidden="true"></i></span>
              <div class="quick-action-text"><div class="quick-action-title">添加用户</div><div class="quick-action-desc">创建新用户账号</div></div>
              <span style="color:var(--color-text-placeholder)">→</span>
            </div>
            <div class="quick-action" onclick="Common.navigateInParent('商品管理.html', '商品管理')">
              <span class="quick-action-icon green"><i class="fa fa-plus-square-o" aria-hidden="true"></i></span>
              <div class="quick-action-text"><div class="quick-action-title">上架商品</div><div class="quick-action-desc">发布新商品到商城</div></div>
              <span style="color:var(--color-text-placeholder)">→</span>
            </div>
            <div class="quick-action" onclick="Common.navigateInParent('订单管理.html', '订单管理')">
              <span class="quick-action-icon orange"><i class="fa fa-clipboard" aria-hidden="true"></i></span>
              <div class="quick-action-text"><div class="quick-action-title">处理订单</div><div class="quick-action-desc">查看待处理订单</div></div>
              <span style="color:var(--color-text-placeholder)">→</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var C = {
        primary: '#2563EB', primaryLight: '#60A5FA',
        success: '#10B981', warning: '#F59E0B', danger: '#EF4444',
        info: '#3B82F6', purple: '#8B5CF6', pink: '#EC4899', teal: '#14B8A6',
        textSec: '#6B7280', border: '#E5E7EB', splitLine: '#F3F4F6'
      };
      var charts = [];
      function regChart(dom, option) {
        var c = echarts.init(dom);
        c.setOption(option);
        charts.push(c);
        return c;
      }
      window.addEventListener('resize', function () { charts.forEach(function (c) { c.resize(); }); });

      var statusMap = {
        pending:   { text: '待付款', cls: 'pending' },
        paid:      { text: '已付款', cls: 'paid' },
        shipped:   { text: '已发货', cls: 'shipped' },
        completed: { text: '已完成', cls: 'completed' },
        cancelled: { text: '已取消', cls: 'cancelled' }
      };

      /* ---- 统计卡片 ---- */
      MockAPI.getStats().then(function (stats) {
        document.getElementById('statUsers').textContent = Common.formatNumber(stats.totalUsers);
        document.getElementById('statProducts').textContent = Common.formatNumber(stats.onProducts);
        document.getElementById('statOrders').textContent = Common.formatNumber(stats.totalOrders);
        document.getElementById('statRevenue').textContent = Common.formatMoney(stats.totalRevenue);
      });

      /* ---- 1. 营收趋势折线图 ---- */
      regChart(document.getElementById('trendChart'), {
        tooltip: { trigger: 'axis', formatter: function (p) { return p[0].axisValue + '<br/>' + p.map(function (s) { return s.marker + ' ' + s.seriesName + ': ¥' + Common.formatNumber(s.value); }).join('<br/>'); } },
        legend: { data: ['营收', '利润'], bottom: 0, textStyle: { fontSize: 12, color: C.textSec } },
        grid: { left: '3%', right: '4%', bottom: '14%', top: '8%', containLabel: true },
        xAxis: { type: 'category', data: ['周一','周二','周三','周四','周五','周六','周日'], boundaryGap: false, axisLine: { lineStyle: { color: C.border } }, axisLabel: { color: C.textSec }, axisTick: { show: false } },
        yAxis: { type: 'value', name: '¥', nameTextStyle: { color: C.textSec }, axisLabel: { formatter: function (v) { return (v / 1000).toFixed(0) + 'k'; }, color: C.textSec }, splitLine: { lineStyle: { color: C.splitLine } }, axisLine: { show: false }, axisTick: { show: false } },
        series: [
          {
            name: '营收', type: 'line', smooth: true,
            lineStyle: { width: 3, color: C.primary },
            areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(37,99,235,0.25)' }, { offset: 1, color: 'rgba(37,99,235,0.02)' }]) },
            symbol: 'circle', symbolSize: 8,
            itemStyle: { color: C.primary, borderColor: '#fff', borderWidth: 2 },
            data: [3200, 4100, 3800, 5200, 4800, 6800, 5900]
          },
          {
            name: '利润', type: 'line', smooth: true,
            lineStyle: { width: 2, color: C.success, type: 'dashed' },
            symbol: 'diamond', symbolSize: 7,
            itemStyle: { color: C.success },
            data: [960, 1230, 1140, 1560, 1440, 2040, 1770]
          }
        ]
      });

      /* ---- 2. 订单状态分布环形图 ---- */
      regChart(document.getElementById('orderStatusChart'), {
        tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
        legend: { bottom: 0, textStyle: { fontSize: 11, color: C.textSec }, itemWidth: 10, itemHeight: 10 },
        grid: { top: '5%', bottom: '25%' },
        series: [{
          name: '订单状态', type: 'pie', radius: ['42%', '68%'], center: ['50%', '42%'],
          avoidLabelOverlap: true,
          itemStyle: { borderColor: '#fff', borderWidth: 2, borderRadius: 4 },
          label: { show: true, fontSize: 12, color: C.textSec, formatter: '{d}%' },
          labelLine: { length: 8, length2: 8 },
          emphasis: { label: { fontSize: 14, fontWeight: 'bold' }, scaleSize: 6 },
          data: [
            { value: 128, name: '待付款', itemStyle: { color: C.warning } },
            { value: 256, name: '已付款', itemStyle: { color: C.info } },
            { value: 189, name: '已发货', itemStyle: { color: C.primary } },
            { value: 520, name: '已完成', itemStyle: { color: C.success } },
            { value: 47,  name: '已取消', itemStyle: { color: C.danger } }
          ]
        }]
      });

      /* ---- 3. 商品分类销量柱状图 ---- */
      regChart(document.getElementById('categoryChart'), {
        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: function (p) { return p[0].axisValue + '<br/>' + p.map(function (s) { return s.marker + ' ' + s.seriesName + ': ' + s.value + '件'; }).join('<br/>'); } },
        legend: { bottom: 0, textStyle: { fontSize: 12, color: C.textSec } },
        grid: { left: '3%', right: '4%', bottom: '14%', top: '8%', containLabel: true },
        xAxis: { type: 'category', data: ['电子产品','服装鞋包','食品生鲜','美妆个护','家居日用','运动户外'], axisLine: { lineStyle: { color: C.border } }, axisLabel: { color: C.textSec, fontSize: 11, interval: 0 }, axisTick: { show: false } },
        yAxis: { type: 'value', axisLabel: { color: C.textSec }, splitLine: { lineStyle: { color: C.splitLine } }, axisLine: { show: false }, axisTick: { show: false } },
        series: [
          {
            name: '本月销量', type: 'bar', barWidth: '35%', itemStyle: {
              borderRadius: [4, 4, 0, 0],
              color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: C.primary }, { offset: 1, color: C.primaryLight }])
            },
            data: [1820, 1350, 980, 760, 640, 420]
          },
          {
            name: '上月销量', type: 'bar', barWidth: '35%', itemStyle: { borderRadius: [4, 4, 0, 0], color: '#DBEAFE' },
            data: [1650, 1200, 1050, 680, 590, 380]
          }
        ]
      });

      /* ---- 4. 流量来源玫瑰图 ---- */
      regChart(document.getElementById('trafficChart'), {
        tooltip: { trigger: 'item', formatter: '{b}: {c} 访问 ({d}%)' },
        legend: { bottom: 0, textStyle: { fontSize: 11, color: C.textSec }, itemWidth: 10, itemHeight: 10 },
        series: [{
          name: '流量来源', type: 'pie', radius: ['18%', '70%'], center: ['50%', '44%'],
          roseType: 'area',
          itemStyle: { borderRadius: 5 },
          label: { show: true, fontSize: 11, color: C.textSec, formatter: '{b}\n{d}%' },
          labelLine: { length: 6, length2: 8 },
          data: [
            { value: 4200, name: '搜索引擎', itemStyle: { color: C.primary } },
            { value: 2800, name: '直接访问', itemStyle: { color: C.success } },
            { value: 2100, name: '社交媒体', itemStyle: { color: C.warning } },
            { value: 1500, name: '广告推广', itemStyle: { color: C.purple } },
            { value: 900,  name: '外部链接', itemStyle: { color: C.teal } },
            { value: 500,  name: '其他',     itemStyle: { color: C.pink } }
          ]
        }]
      });

      /* ---- 最近订单 ---- */
      MockAPI.getOrders({ page: 1, pageSize: 6 }).then(function (res) {
        var tbody = document.getElementById('recentOrdersBody');
        if (res.list.length === 0) { Common.renderEmpty(tbody); return; }
        tbody.innerHTML = res.list.map(function (o) {
          var s = statusMap[o.status] || { text: o.status, cls: '' };
          return '<tr>' +
            '<td style="font-size:13px;">' + o.id + '</td>' +
            '<td>' + o.userName + '</td>' +
            '<td>' + o.productName + '</td>' +
            '<td style="font-weight:500;">' + Common.formatMoney(o.amount) + '</td>' +
            '<td><span class="order-status ' + s.cls + '">' + s.text + '</span></td>' +
            '<td style="color:var(--color-text-secondary);font-size:13px;">' + o.date + '</td>' +
            '</tr>';
        }).join('');
      });

      document.getElementById('viewAllOrders').addEventListener('click', function (e) {
        e.preventDefault();
        Common.navigateInParent('订单管理.html', '订单管理');
      });
    })();
  </script>
</body>
</html>
