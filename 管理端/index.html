<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理端 — 后台管理系统</title>



  <!-- ===== 管理端特有样式 ===== -->
  <link rel="stylesheet" href="管理端.css">

  <!-- ===== 公共 JS ===== -->
  <script src="../公共/scripts/common.js"></script>
  <script src="../公共/scripts/event-bus.js"></script>
  <script src="../公共/scripts/state-manager.js"></script>
  <script src="../公共/scripts/mock-api.js"></script>
</head>
<body>
  <div class="admin-layout">
    <!-- ===== 侧边栏 ===== -->
    <aside class="admin-sidebar" id="sidebar">
      <div class="sidebar-logo">
        <i class="fa fa-cog sidebar-logo-icon" aria-hidden="true"></i>
        <span class="sidebar-logo-text">管理后台</span>
      </div>
      <nav class="sidebar-nav">
        <a class="sidebar-item active" data-page="仪表盘.html" data-title="仪表盘">
          <i class="fa fa-dashboard sidebar-item-icon" aria-hidden="true"></i>
          <span class="sidebar-label">仪表盘</span>
        </a>
        <a class="sidebar-item" data-page="用户管理.html" data-title="用户管理">
          <i class="fa fa-users sidebar-item-icon" aria-hidden="true"></i>
          <span class="sidebar-label">用户管理</span>
        </a>
        <a class="sidebar-item" data-page="商品管理.html" data-title="商品管理">
          <i class="fa fa-cube sidebar-item-icon" aria-hidden="true"></i>
          <span class="sidebar-label">商品管理</span>
        </a>
        <a class="sidebar-item" data-page="订单管理.html" data-title="订单管理">
          <i class="fa fa-file-text-o sidebar-item-icon" aria-hidden="true"></i>
          <span class="sidebar-label">订单管理</span>
        </a>
      </nav>
    </aside>

    <!-- ===== 主区域 ===== -->
    <div class="admin-main">
      <!-- 顶栏 -->
      <header class="admin-topbar">
        <div class="topbar-left">
          <div class="topbar-toggle" id="toggleSidebar"><i class="fa fa-bars" aria-hidden="true"></i></div>
          <span class="topbar-title" id="pageTitle">仪表盘</span>
        </div>
        <div class="topbar-right">
          <div class="topbar-actions">
            <div class="topbar-icon-btn" title="搜索" onclick="Common.toast('搜索功能', 'info')"><i class="fa fa-search" aria-hidden="true"></i></div>
            <div class="topbar-icon-btn" title="消息" onclick="Common.toast('暂无新消息', 'info')"><i class="fa fa-bell-o" aria-hidden="true"></i><span class="icon-badge"></span></div>
            <div class="topbar-icon-btn" title="帮助" onclick="Common.toast('帮助中心', 'info')"><i class="fa fa-question-circle-o" aria-hidden="true"></i></div>
            <div class="topbar-icon-btn" title="设置" onclick="Common.toast('设置功能', 'info')"><i class="fa fa-cog" aria-hidden="true"></i></div>
          </div>
          <div class="topbar-user">
            <div class="topbar-avatar">管</div>
            <span style="font-size:14px;">管理员</span>
          </div>
        </div>
      </header>

      <!-- iframe 内容区 -->
      <div class="admin-content">
        <div class="iframe-loading" id="iframeLoading">
          <div class="spinner"></div>
        </div>
        <iframe id="pageFrame" src="仪表盘.html"></iframe>
      </div>
    </div>
  </div>

  <!-- ===== 管理端框架脚本 ===== -->
  <script>
    (function () {
      var sidebar = document.getElementById('sidebar');
      var pageFrame = document.getElementById('pageFrame');
      var pageTitle = document.getElementById('pageTitle');
      var loadingEl = document.getElementById('iframeLoading');
      var navItems = document.querySelectorAll('.sidebar-item');

      // 导航切换
      navItems.forEach(function (item) {
        item.addEventListener('click', function (e) {
          e.preventDefault();
          navigateTo(item.dataset.page, item.dataset.title);
          navItems.forEach(function (n) { n.classList.remove('active'); });
          item.classList.add('active');
        });
      });

      // 侧边栏折叠
      document.getElementById('toggleSidebar').addEventListener('click', function () {
        sidebar.classList.toggle('collapsed');
      });

      // 导航函数
      function navigateTo(page, title) {
        loadingEl.classList.add('show');
        pageFrame.src = page;
        if (title) pageTitle.textContent = title;
        pageFrame.onload = function () {
          loadingEl.classList.remove('show');
        };
      }

      // 监听子页面导航请求
      Common.onChildNavigate(function (data) {
        var page = data.page;
        var title = data.title;
        var targetItem = document.querySelector('.sidebar-item[data-page="' + page + '"]');
        if (targetItem) {
          navItems.forEach(function (n) { n.classList.remove('active'); });
          targetItem.classList.add('active');
        }
        navigateTo(page, title || (targetItem ? targetItem.dataset.title : ''));
      });

      window.adminNavigate = navigateTo;
    })();
  </script>
</body>
</html>
