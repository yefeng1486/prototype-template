<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品列表</title>
  <link rel="stylesheet" href="用户端.css">
  <script src="../公共/scripts/common.js"></script>
  <script src="../公共/scripts/mock-api.js"></script>

  <style>
    .list-page { display: flex; gap: var(--space-lg); max-width: 1200px; margin: 0 auto; padding: var(--space-lg); }

    /* 侧边筛选 */
    .filter-panel { width: 200px; flex-shrink: 0; }
    .filter-group { margin-bottom: var(--space-lg); }
    .filter-title { font-size: 14px; font-weight: 600; margin-bottom: var(--space-sm); }
    .filter-option { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 14px; cursor: pointer; color: var(--color-text-secondary); }
    .filter-option:hover { color: var(--color-primary); }
    .filter-option.active { color: var(--color-primary); font-weight: 500; }
    .filter-option input { cursor: pointer; }

    /* 商品列表 */
    .list-main { flex: 1; min-width: 0; }
    .list-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-md); }
    .sort-tabs { display: flex; gap: 4px; }
    .sort-tab { padding: 6px 14px; border-radius: var(--radius-md); font-size: 14px; cursor: pointer; transition: all var(--transition-fast); }
    .sort-tab:hover { background: var(--color-bg-hover); }
    .sort-tab.active { background: var(--color-primary); color: #fff; }

    .product-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-md); }
    .product-card { background: #fff; border: 1px solid var(--color-border-light); border-radius: var(--radius-lg); overflow: hidden; cursor: pointer; transition: all var(--transition-fast); box-shadow: var(--shadow-sm); }
    .product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .product-image { height: 120px; display: flex; align-items: center; justify-content: center; font-size: 42px; background: var(--color-bg-hover); }
    .product-info { padding: var(--space-md); }
    .product-name { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
    .product-desc { font-size: 12px; color: var(--color-text-secondary); margin-bottom: var(--space-sm); }
    .product-bottom { display: flex; align-items: center; justify-content: space-between; }
    .product-price { font-size: 18px; font-weight: 700; color: var(--color-danger); }
    .product-sales { font-size: 12px; color: var(--color-text-placeholder); }
    .product-stock { font-size: 11px; padding: 1px 6px; border-radius: var(--radius-sm); }
    .product-stock.ok { background: var(--color-success-bg); color: var(--color-success); }
    .product-stock.low { background: var(--color-warning-bg); color: var(--color-warning); }
    .product-stock.none { background: var(--color-danger-bg); color: var(--color-danger); }
  </style>
</head>
<body>
  <div class="list-page">
    <!-- 筛选侧边 -->
    <aside class="filter-panel">
      <div class="filter-group">
        <div class="filter-title">商品分类</div>
        <div class="filter-option active" data-cat="">全部分类</div>
        <div class="filter-option" data-cat="智能穿戴">智能穿戴</div>
        <div class="filter-option" data-cat="音频设备">音频设备</div>
        <div class="filter-option" data-cat="电脑外设">电脑外设</div>
        <div class="filter-option" data-cat="手机配件">手机配件</div>
        <div class="filter-option" data-cat="家居生活">家居生活</div>
      </div>
      <div class="filter-group">
        <div class="filter-title">价格区间</div>
        <div class="filter-option">○ 0 - 200元</div>
        <div class="filter-option">○ 200 - 500元</div>
        <div class="filter-option">○ 500 - 1000元</div>
        <div class="filter-option">○ 1000元以上</div>
      </div>
    </aside>

    <!-- 商品列表 -->
    <div class="list-main">
      <div class="list-toolbar">
        <span style="font-size:14px;color:var(--color-text-secondary);" id="resultCount">加载中...</span>
        <div class="sort-tabs">
          <div class="sort-tab active">综合</div>
          <div class="sort-tab">销量</div>
          <div class="sort-tab">价格 ↑</div>
          <div class="sort-tab">价格 ↓</div>
        </div>
      </div>
      <div class="product-list" id="productList">
        <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--color-text-placeholder);">加载中...</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var currentCategory = '';

      function loadData() {
        MockAPI.getProducts({ page: 1, pageSize: 50, category: currentCategory }).then(function (res) {
          document.getElementById('resultCount').textContent = '共 ' + res.total + ' 件商品';
          var list = document.getElementById('productList');
          if (res.list.length === 0) { Common.renderEmpty(list, '该分类下暂无商品'); return; }
          list.innerHTML = res.list.map(function (p) {
            var stockHtml = p.stock === 0 ? '<span class="product-stock none">缺货</span>'
              : (p.stock < 50 ? '<span class="product-stock low">库存紧张</span>' : '<span class="product-stock ok">有货</span>');
            return '<div class="product-card" onclick="Common.navigateInParent(\'商品详情.html\',\'商品详情\')">' +
              '<div class="product-image">' + p.image + '</div>' +
              '<div class="product-info">' +
                '<div class="product-name">' + p.name + '</div>' +
                '<div class="product-desc">' + p.description + '</div>' +
                '<div class="product-bottom">' +
                  '<span class="product-price">' + Common.formatMoney(p.price) + '</span>' +
                  '<span class="product-sales">已售' + p.sales + '</span>' +
                '</div>' +
                '<div style="margin-top:6px;">' + stockHtml + '</div>' +
              '</div>' +
            '</div>';
          }).join('');
        });
      }

      document.querySelectorAll('.filter-option[data-cat]').forEach(function (el) {
        el.addEventListener('click', function () {
          document.querySelectorAll('.filter-option[data-cat]').forEach(function (o) { o.classList.remove('active'); });
          el.classList.add('active');
          currentCategory = el.dataset.cat;
          loadData();
        });
      });

      loadData();
    })();
  </script>
</body>
</html>
