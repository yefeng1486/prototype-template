<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品详情</title>
  <link rel="stylesheet" href="../公共/design-system/design-system.css">
  <link rel="stylesheet" href="../公共/styles/main.css">
  <link rel="stylesheet" href="../公共/lib/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="用户端.css">
  <script src="../公共/scripts/common.js"></script>
  <script src="../公共/scripts/mock-api.js"></script>

  <style>
    .detail-page { max-width: 1000px; margin: 0 auto; padding: var(--space-lg); }

    /* 面包屑 */
    .breadcrumb { font-size: 13px; color: var(--color-text-secondary); margin-bottom: var(--space-md); }
    .breadcrumb a { color: var(--color-text-secondary); }
    .breadcrumb a:hover { color: var(--color-primary); }

    /* 商品主区域 */
    .product-main { display: grid; grid-template-columns: 360px 1fr; gap: var(--space-xl); margin-bottom: var(--space-xl); }
    .product-gallery {
      background: var(--color-bg-hover); border-radius: var(--radius-lg);
      height: 340px; display: flex; align-items: center; justify-content: center;
      font-size: 140px;
    }
    .product-info-detail h1 { font-size: 22px; font-weight: 700; margin-bottom: var(--space-sm); }
    .product-subtitle { font-size: 14px; color: var(--color-text-secondary); margin-bottom: var(--space-md); }
    .price-box { background: linear-gradient(135deg, #FEF2F2 0%, #FFF7ED 100%); border-radius: var(--radius-lg); padding: var(--space-md) var(--space-lg); margin-bottom: var(--space-lg); }
    .price-current { font-size: 24px; font-weight: 800; color: var(--color-danger); }
    .price-original { font-size: 14px; color: var(--color-text-placeholder); text-decoration: line-through; margin-left: var(--space-sm); }
    .price-tag { display: inline-block; padding: 2px 8px; background: var(--color-danger); color: #fff; font-size: 12px; border-radius: var(--radius-sm); margin-left: var(--space-sm); }

    .spec-row { display: flex; padding: var(--space-sm) 0; border-bottom: 1px solid var(--color-border-light); }
    .spec-label { width: 100px; color: var(--color-text-secondary); font-size: 14px; }
    .spec-value { font-size: 14px; font-weight: 500; }

    .quantity-row { display: flex; align-items: center; gap: var(--space-md); margin: var(--space-lg) 0; }
    .quantity-control { display: flex; align-items: center; border: 1px solid var(--color-border-dark); border-radius: var(--radius-md); }
    .quantity-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; user-select: none; }
    .quantity-btn:hover { background: var(--color-bg-hover); }
    .quantity-input { width: 50px; height: 36px; text-align: center; border: none; border-left: 1px solid var(--color-border-dark); border-right: 1px solid var(--color-border-dark); font-size: 15px; }

    .action-row { display: flex; gap: var(--space-md); }
    .btn-cart { flex: 1; height: 48px; font-size: 16px; background: var(--color-danger); color: #fff; }
    .btn-buy { flex: 1; height: 48px; font-size: 16px; background: var(--color-warning); color: #fff; }

    /* 商品详情 Tab */
    .detail-tabs { border-bottom: 2px solid var(--color-border); margin-bottom: var(--space-lg); }
    .detail-tab { display: inline-block; padding: 12px 24px; font-size: 15px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .detail-tab.active { border-bottom-color: var(--color-primary); color: var(--color-primary); }
    .detail-content { line-height: 1.8; font-size: 14px; color: var(--color-text-secondary); }
    .detail-content h3 { color: var(--color-text-primary); margin: var(--space-md) 0 var(--space-sm); }
  </style>
</head>
<body>
  <div class="detail-page">
    <!-- 面包屑 -->
    <div class="breadcrumb">
      <a href="#" onclick="event.preventDefault();Common.navigateInParent('首页.html','首页')">首页</a>
      <span> / </span>
      <a href="#" onclick="event.preventDefault();Common.navigateInParent('商品列表.html','商品列表')">商品列表</a>
      <span> / 商品详情</span>
    </div>

    <!-- 商品主体 -->
    <div class="product-main" id="productMain">
      <div style="grid-column:1/-1;text-align:center;padding:80px;color:var(--color-text-placeholder);">加载中...</div>
    </div>

    <!-- 详情Tab -->
    <div class="detail-tabs">
      <div class="detail-tab active">商品详情</div>
      <div class="detail-tab">规格参数</div>
      <div class="detail-tab">用户评价(892)</div>
    </div>
    <div class="detail-content">
      <h3>产品介绍</h3>
      <p>本产品采用最新工艺制造，兼具高品质与实用性。支持全天候使用，满足日常各类场景需求。通过严格的质量检测，确保每一件产品都达到行业领先标准。</p>
      <h3>核心卖点</h3>
      <p>• 高性能芯片，响应速度提升 40%<br>• 超长续航，单次充电使用更久<br>• 智能连接，一键配对即插即用<br>• 人性化设计，轻量便携不累赘</p>
      <h3>包装清单</h3>
      <p>产品主机 × 1、充电线 × 1、说明书 × 1、保修卡 × 1</p>
    </div>
  </div>

  <script>
    (function () {
      MockAPI.getProductById(1).then(function (p) {
        if (!p) return;
        var main = document.getElementById('productMain');
        main.innerHTML =
          '<div class="product-gallery">' + p.image + '</div>' +
          '<div class="product-info-detail">' +
            '<h1>' + p.name + '</h1>' +
            '<div class="product-subtitle">' + p.description + '</div>' +
            '<div class="price-box">' +
              '<span class="price-current">' + Common.formatMoney(p.price) + '</span>' +
              '<span class="price-original">' + Common.formatMoney(p.price * 1.3) + '</span>' +
              '<span class="price-tag">7折特惠</span>' +
            '</div>' +
            '<div class="spec-row"><div class="spec-label">分类</div><div class="spec-value">' + p.category + '</div></div>' +
            '<div class="spec-row"><div class="spec-label">库存</div><div class="spec-value">' + p.stock + ' 件</div></div>' +
            '<div class="spec-row"><div class="spec-label">销量</div><div class="spec-value">' + Common.formatNumber(p.sales) + ' 件</div></div>' +
            '<div class="spec-row"><div class="spec-label">发货地</div><div class="spec-value">深圳</div></div>' +
            '<div class="quantity-row">' +
              '<span style="font-size:14px;">数量</span>' +
              '<div class="quantity-control">' +
                '<div class="quantity-btn" onclick="changeQty(-1)">−</div>' +
                '<input class="quantity-input" id="qtyInput" type="text" value="1" readonly>' +
                '<div class="quantity-btn" onclick="changeQty(1)">+</div>' +
              '</div>' +
            '</div>' +
            '<div class="action-row">' +
              '<button class="btn btn-buy" onclick="Common.toast(\'立即购买功能待开发\', \'info\')">立即购买</button>' +
              '<button class="btn btn-cart" onclick="Common.toast(\'已加入购物车\', \'success\')">加入购物车</button>' +
            '</div>' +
          '</div>';
      });

      window.changeQty = function (delta) {
        var input = document.getElementById('qtyInput');
        var val = Math.max(1, parseInt(input.value) + delta);
        input.value = val;
      };

      document.querySelectorAll('.detail-tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
          document.querySelectorAll('.detail-tab').forEach(function (t) { t.classList.remove('active'); });
          tab.classList.add('active');
        });
      });
    })();
  </script>
</body>
</html>
